    preLp.frequency.value = 1350;
    preLp.Q.value = 0.5;

    const ap1 = audioCtx.createBiquadFilter();
    ap1.type = 'allpass';
    ap1.frequency.value = 540;
    ap1.Q.value = 0.5;

    const ap2 = audioCtx.createBiquadFilter();
    ap2.type = 'allpass';
    ap2.frequency.value = 1180;
    ap2.Q.value = 0.5;

    input.connect(preLp);
    preLp.connect(ap1);
    ap1.connect(ap2);

    const delayTimes = [0.079, 0.113, 0.149, 0.193];
    const merger = audioCtx.createChannelMerger(2);
    const outGain = audioCtx.createGain();
    outGain.gain.value = 0.30;

    const nodes = [input, preLp, ap1, ap2, merger, outGain];
    const delays = [];

    for (let i = 0; i < delayTimes.length; i++) {
      const d = audioCtx.createDelay(0.35);
      d.delayTime.value = delayTimes[i];
      const damp = audioCtx.createBiquadFilter();
      damp.type = 'lowpass';
      damp.frequency.value = 1200;
      damp.Q.value = 0.5;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.42;

      ap2.connect(d);
      d.connect(damp);
      damp.connect(fb);
      d.connect(merger, 0, i % 2);

      delays.push({ d, damp, fb });
      nodes.push(d, damp, fb);
    }

    for (let i = 0; i < delays.length; i++) {
      const next = delays[(i + 1) % delays.length];
      delays[i].fb.connect(next.d);
    }

    merger.connect(outGain);
    outGain.connect(destNode);
    fdnNodes = nodes;
    return input;
  }

  function syncReverbMode() {
    if (!fdnSend || !ctx) return;
    const sendVal =
      reverbMode === 'Lite FDN Live' ? 0.36 :
      reverbMode === 'Hybrid (OGG + Lite FDN)' ? 0.12 :
      0.0;
    fdnSend.gain.setTargetAtTime(sendVal, ctx.currentTime, 0.05);
  }

  function syncTrackPianoFilter(track) {
    if (!ctx || !pianoFeltFilter || !pianoSilkShelf) return;
    const now = ctx.currentTime;
    pianoFeltFilter.frequency.setTargetAtTime(track.pianoCutoffHz || 1050, now, 0.12);
    pianoSilkShelf.gain.setTargetAtTime(track.pianoShelfDb ?? -8.0, now, 0.12);
  }

  // Instant zero-network fallback: renders smooth, dark-damped (Q = 0.5, zero ringing) root buffers
  // locally via OfflineAudioContext + ConvolverNode in ~25ms while 320kbps .ogg files stream in.
  async function buildOfflineStampedFallback() {
    const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OfflineCtx) return;
    const quickZones = [
      { voice: 'piano', midi: 48, dur: 4.5 },
      { voice: 'piano', midi: 60, dur: 4.2 },
      { voice: 'piano', midi: 72, dur: 4.0 },
      { voice: 'pad',   midi: 55, dur: 5.2 },
      { voice: 'bell',  midi: 67, dur: 4.2 },
      { voice: 'choir', midi: 60, dur: 5.2 },
      { voice: 'tape',  midi: 55, dur: 4.6 },
      { voice: 'drone', midi: 43, dur: 5.4 },
    ];

    const rate = 24000;
    await Promise.all(quickZones.map(async (z) => {
      try {
        const frames = Math.floor(rate * z.dur);
        const octx = new OfflineCtx(2, frames, rate);
        const freq = 440 * Math.pow(2, (z.midi - 69) / 12);

        const irDur = Math.min(z.dur - 0.3, 3.4);
        const irLen = Math.floor(rate * irDur);
        const irBuf = octx.createBuffer(2, irLen, rate);
        const irL = irBuf.getChannelData(0);
        const irR = irBuf.getChannelData(1);
        let s = (z.midi * 2654435761) >>> 0;
        const rand = () => { s = (s * 1664525 + 1013904223) >>> 0; return (s / 4294967296) * 2 - 1; };
        const decay = 3.8 / irDur;
        let lpL = 0, lpR = 0;
        for (let i = 0; i < irLen; i++) {
          const t = i / rate;
          const env = 0.5 * (1 - Math.cos(Math.PI * Math.min(1, t / 0.025))) * Math.exp(-decay * t);
          lpL += 0.16 * (rand() * env - lpL);
          lpR += 0.16 * (rand() * env - lpR);
          irL[i] = lpL;
          irR[i] = lpR;
        }

        const conv = octx.createConvolver();
        conv.buffer = irBuf;
        const damp = octx.createBiquadFilter();
        damp.type = 'lowpass';
        damp.frequency.value = z.voice === 'piano' ? 1300 : 1700;
        damp.Q.value = 0.5;
        const wet = octx.createGain();
        wet.gain.value = z.voice === 'piano' ? 0.30 : 0.45;
        damp.connect(conv);
        conv.connect(wet);
        wet.connect(octx.destination);

        const env = octx.createGain();
        const isPerc = z.voice === 'piano' || z.voice === 'bell';
        env.gain.setValueAtTime(0.0001, 0);
        if (isPerc) {
          env.gain.linearRampToValueAtTime(0.60, 0.010);
          env.gain.exponentialRampToValueAtTime(0.0001, z.dur - 0.15);
        } else {
          // Flat sustained plateau for pad/choir/drone/tape so looped washes never decay early
          env.gain.linearRampToValueAtTime(0.56, 0.45);
          env.gain.setValueAtTime(0.56, z.dur - 0.40);
          env.gain.linearRampToValueAtTime(0.0001, z.dur - 0.04);
        }
        env.connect(octx.destination);
        env.connect(damp);

        const o1 = octx.createOscillator();
        o1.type = z.voice === 'pad' ? 'triangle' : 'sine';
        o1.frequency.value = freq;
        const o2 = octx.createOscillator();
        o2.type = 'sine';
        o2.frequency.value = freq * 2.0;
        const g2 = octx.createGain();
        g2.gain.value = z.voice === 'piano' ? 0.16 : 0.18;
        const lp = octx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = z.voice === 'piano' ? 950 : Math.min(1800, freq * 2.5);
        lp.Q.value = 0.5;
        o1.connect(lp);
        o2.connect(g2);
        g2.connect(lp);
        lp.connect(env);
        o1.start(0);
        o2.start(0);
        o1.stop(z.dur - 0.1);
        o2.stop(z.dur - 0.1);

        const rendered = await octx.startRendering();
        registerSample(z.voice, z.midi, rendered, 'offline');
      } catch {}
    }));
    offlineFallbackReady = true;
  }

  // Stream & decode the 320 kbps reverb-stamped .ogg samples (with 320 kbps .mp3 fallback)
  async function loadServerSamples() {
    if (sampleLoadStarted || !ctx) return;
    sampleLoadStarted = true;
    preferredFormat = detectAudioFormat();

    const fetchZone = async (zone) => {
      const urls = preferredFormat === 'ogg'
        ? [`samples/${zone.id}.ogg`, `samples/${zone.id}.mp3`]
        : [`samples/${zone.id}.mp3`, `samples/${zone.id}.ogg`];
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) continue;
          const ab = await resp.arrayBuffer();
          const decoded = await ctx.decodeAudioData(ab);
          if (decoded) {
            const fmt = url.endsWith('.ogg') ? 'ogg' : 'mp3';
            registerSample(zone.voice, zone.midi, decoded, fmt);
            oggSamplesLoaded++;
            return true;
          }
        } catch {}
      }
      return false;
    };

    const priority = SAMPLE_ZONES.filter((z) => z.midi >= 48 && z.midi <= 72);
    const outer = SAMPLE_ZONES.filter((z) => z.midi < 48 || z.midi > 72);
    const ordered = [...priority, ...outer];
    const BATCH_SIZE = 4;
    for (let i = 0; i < ordered.length; i += BATCH_SIZE) {
      await Promise.all(ordered.slice(i, i + BATCH_SIZE).map(fetchZone));
    }
  }

  function scheduleSamplePreloadAfterFirstFrame() {
    const startPreload = () => {
      buildOfflineStampedFallback();
      loadServerSamples();
    };
    if (typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(() => {
        setTimeout(startPreload, 150);
      });
    } else {
      setTimeout(startPreload, 150);
    }
  }

  function ensureContext() {
    if (ctx) return ctx;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    try {
      ctx = new AudioCtx({ latencyHint: 'playback' });
    } catch {
      ctx = new AudioCtx();
    }

    masterGain = ctx.createGain();
    masterGain.gain.value = enabled ? volume : 0;
    masterGain.connect(ctx.destination);

    dryBus = ctx.createGain();
    dryBus.gain.value = 1.0;
    dryBus.connect(masterGain);

    // Live per-track 3-stage Felt Piano bus filters (Q = 0.5, zero resonance peak)
    // Ensures pitch-shifted piano samples stay warm, soft, and completely ring-free
    const track = ENSO_TRACKS[trackIndex];
    pianoFeltFilter = ctx.createBiquadFilter();
    pianoFeltFilter.type = 'lowpass';
    pianoFeltFilter.frequency.value = track.pianoCutoffHz || 1050;
    pianoFeltFilter.Q.value = 0.5;

    pianoSilkShelf = ctx.createBiquadFilter();
    pianoSilkShelf.type = 'highshelf';
    pianoSilkShelf.frequency.value = 1350;
    pianoSilkShelf.Q.value = 0.5;
    pianoSilkShelf.gain.value = track.pianoShelfDb ?? -8.0;

    pianoFeltFilter.connect(pianoSilkShelf);
    pianoSilkShelf.connect(dryBus);
    if (ctx.createAnalyser) {
      pianoAnalyser = ctx.createAnalyser();
      pianoAnalyser.fftSize = 2048;
      pianoAnalyserBuf = new Float32Array(pianoAnalyser.fftSize);
      pianoSilkShelf.connect(pianoAnalyser);
    }

    // Warm lowpass bus for background pads/choir/tape/drone/bell (Q = 0.5)
    bgWarmFilter = ctx.createBiquadFilter();
    bgWarmFilter.type = 'lowpass';
    bgWarmFilter.frequency.value = 1850;
    bgWarmFilter.Q.value = 0.5;
    bgWarmFilter.connect(dryBus);

    fdnSend = buildLiteFdnReverb(ctx, masterGain);
    syncReverbMode();

    // Dedicated Persistent Harmonic Synth Drone / Wash bus (0% sample decay, warm 2-stage Q = 0.5 silk filters)
    washMasterGain = ctx.createGain();
    washMasterGain.gain.value = washLevel;
    washMasterGain.connect(dryBus);

    washFdnTap = ctx.createGain();
    washFdnTap.gain.value = 0.42;
    washMasterGain.connect(washFdnTap);
    if (fdnSend) washFdnTap.connect(fdnSend);

    washEnvGain = ctx.createGain();
    washEnvGain.gain.value = 0.0;
    washEnvGain.connect(washMasterGain);

    if (ctx.createAnalyser) {
      washAnalyser = ctx.createAnalyser();
      washAnalyser.fftSize = 2048;
      washAnalyserBuf = new Float32Array(washAnalyser.fftSize);
      washEnvGain.connect(washAnalyser);
    }

    washFormantFilter = ctx.createBiquadFilter();
    washFormantFilter.type = 'peaking';
    washFormantFilter.frequency.value = 260;
    washFormantFilter.Q.value = 0.55;
    washFormantFilter.gain.value = 2.0;

    washSilkFilter = ctx.createBiquadFilter();
    washSilkFilter.type = 'lowpass';
    washSilkFilter.frequency.value = 540;
    washSilkFilter.Q.value = 0.5;

    washWarmShelf = ctx.createBiquadFilter();
    washWarmShelf.type = 'highshelf';
    washWarmShelf.frequency.value = 1150;
    washWarmShelf.Q.value = 0.5;
    washWarmShelf.gain.value = -8.5;

    washFormantFilter.connect(washSilkFilter);
    washSilkFilter.connect(washWarmShelf);
    washWarmShelf.connect(washEnvGain);

    initPersistentDroneBank(ctx, track);

    buildSyncBootstrapSamples(ctx);
    scheduleSamplePreloadAfterFirstFrame();
    return ctx;
  }

  function computeWashVoiceSpecs(track, instName) {
    const rawInst = instName || track.washInstrument || 'choir';
    const washVoice = (rawInst === 'piano' || rawInst === 'bell') ? 'pad' : rawInst;
    const scale = track.scale || track.intervals || [0, 2, 4, 5, 7, 9, 11];
    const rootMidi = track.rootMidi || 48;
    const fifthMidi = rootMidi + (scale[4] ?? 7);
    const thirdMidi = rootMidi + (scale[2] ?? 4) + 12;
    const octaveMidi = rootMidi + 12;
    const ninthMidi = rootMidi + (scale[1] ?? 2) + 12;

    // 6 orthogonal, pitch-locked harmonic partials per track (distinct pitches -> zero phase beating, zero pitch drift)
    let specs;
    let filterCfg;
    if (washVoice === 'drone') {
      specs = [
        { voice: washVoice, type: 'sine',     midi: rootMidi - 12,   gain: 0.135, pan: -0.06 },
        { voice: washVoice, type: 'triangle', midi: rootMidi,        gain: 0.112, pan: -0.22 },
        { voice: washVoice, type: 'sine',     midi: fifthMidi - 12,  gain: 0.092, pan: +0.22 },
        { voice: washVoice, type: 'sine',     midi: octaveMidi,      gain: 0.056, pan: +0.14 },
        { voice: washVoice, type: 'triangle', midi: fifthMidi,       gain: 0.048, pan: -0.26 },
        { voice: washVoice, type: 'sine',     midi: ninthMidi - 12,  gain: 0.046, pan: +0.24 },
      ];
      filterCfg = { cutoffHz: 460, q: 0.5, formantHz: 190, formantGainDb: 2.2, shelfDb: -9.5 };
    } else if (washVoice === 'choir') {
      specs = [
        { voice: washVoice, type: 'sine',     midi: rootMidi,        gain: 0.105, pan: -0.20 },
        { voice: washVoice, type: 'triangle', midi: fifthMidi,       gain: 0.092, pan: +0.22 },
        { voice: washVoice, type: 'triangle', midi: octaveMidi,      gain: 0.084, pan: -0.28 },
        { voice: washVoice, type: 'sine',     midi: ninthMidi,       gain: 0.076, pan: +0.28 },
        { voice: washVoice, type: 'sine',     midi: thirdMidi,       gain: 0.062, pan: -0.14 },
        { voice: washVoice, type: 'sine',     midi: fifthMidi + 12,  gain: 0.048, pan: +0.16 },
      ];
      filterCfg = { cutoffHz: 860, q: 0.55, formantHz: 560, formantGainDb: 3.0, shelfDb: -7.0 };
    } else if (washVoice === 'tape') {
      specs = [
        { voice: washVoice, type: 'sine',     midi: rootMidi - 12,   gain: 0.075, pan: -0.08 },
        { voice: washVoice, type: 'triangle', midi: rootMidi,        gain: 0.110, pan: -0.24 },
        { voice: washVoice, type: 'triangle', midi: fifthMidi - 12,  gain: 0.082, pan: +0.24 },
        { voice: washVoice, type: 'sine',     midi: fifthMidi,       gain: 0.076, pan: -0.20 },
        { voice: washVoice, type: 'triangle', midi: octaveMidi,      gain: 0.064, pan: +0.26 },
        { voice: washVoice, type: 'sine',     midi: thirdMidi,       gain: 0.058, pan: +0.16 },
      ];
      filterCfg = { cutoffHz: 620, q: 0.5, formantHz: 290, formantGainDb: 2.2, shelfDb: -8.5 };
    } else {
      // 'pad' (warm CS-80 ribbon pad)
      specs = [
        { voice: washVoice, type: 'sine',     midi: rootMidi - 12,   gain: 0.085, pan: -0.08 },
        { voice: washVoice, type: 'triangle', midi: rootMidi,        gain: 0.112, pan: -0.26 },
        { voice: washVoice, type: 'triangle', midi: fifthMidi,       gain: 0.088, pan: +0.26 },
        { voice: washVoice, type: 'sine',     midi: octaveMidi,      gain: 0.072, pan: -0.18 },
        { voice: washVoice, type: 'sine',     midi: thirdMidi,       gain: 0.064, pan: +0.22 },
        { voice: washVoice, type: 'sine',     midi: fifthMidi + 12,  gain: 0.044, pan: -0.14 },
      ];
      filterCfg = { cutoffHz: 720, q: 0.5, formantHz: 340, formantGainDb: 1.8, shelfDb: -8.0 };
    }
    return { washVoice, specs, filterCfg };
  }

  function updateWashTargetMetadata(track = ENSO_TRACKS[trackIndex], instName = washInstrument) {
    const { washVoice, specs, filterCfg } = computeWashVoiceSpecs(track, instName);
    lastWashChordMidis = specs.map((s) => s.midi);
    lastWashTrackId = track.id;
    lastWashInstrument = washVoice;
    lastWashVoices = specs.map(() => washVoice);
    return { washVoice, specs, filterCfg };
  }

  function initPersistentDroneBank(audioCtx, track) {
    if (droneBank.length > 0 || !audioCtx || !washFormantFilter) return;
    const now = audioCtx.currentTime;
    const { specs, filterCfg } = updateWashTargetMetadata(track, washInstrument);

    washSilkFilter.frequency.setValueAtTime(filterCfg.cutoffHz, now);
    washSilkFilter.Q.setValueAtTime(filterCfg.q, now);
    washFormantFilter.frequency.setValueAtTime(filterCfg.formantHz, now);
    washFormantFilter.gain.setValueAtTime(filterCfg.formantGainDb, now);
    washWarmShelf.gain.setValueAtTime(filterCfg.shelfDb, now);

    // Subtle vibrato-rate LFO (5.2 Hz, ±3.0 cents) for natural shimmer without slow rising/falling pitch drift
    vibratoLfo = audioCtx.createOscillator();
    vibratoLfo.type = 'sine';
    vibratoLfo.frequency.setValueAtTime(VIBRATO_RATE_HZ, now);
    vibratoGain = audioCtx.createGain();
    vibratoGain.gain.setValueAtTime(VIBRATO_DEPTH_CENTS, now);
    vibratoLfo.connect(vibratoGain);
    vibratoLfo.start(now);

    for (let i = 0; i < specs.length; i++) {
      const sp = specs[i];
      const osc = audioCtx.createOscillator();
      osc.type = sp.type;
      const hz = midiToHz(sp.midi);
      osc.frequency.setValueAtTime(hz, now);
      osc.frequency.value = hz;
      if (vibratoGain) vibratoGain.connect(osc.detune);

      const vGain = audioCtx.createGain();
      vGain.gain.setValueAtTime(sp.gain * 1.45, now);

      let panner = null;
      if (audioCtx.createStereoPanner) {
        panner = audioCtx.createStereoPanner();
        panner.pan.setValueAtTime(sp.pan, now);
        osc.connect(vGain);
        vGain.connect(panner);
        panner.connect(washFormantFilter);
      } else {
        osc.connect(vGain);
        vGain.connect(washFormantFilter);
      }

      osc.start(now);
      droneBank.push({ osc, vGain, panner, midi: sp.midi, gain: sp.gain, type: sp.type });
    }
  }

  // Strictly snaps oscillator base frequencies via setValueAtTime ONLY when washEnvLevel === 0 (silent gap).
  // Never calls setTargetAtTime or linearRampToValueAtTime on oscillator frequency!
  function retuneDroneBank(track = ENSO_TRACKS[trackIndex], { forceAtZero = false } = {}) {
    const { washVoice, specs, filterCfg } = updateWashTargetMetadata(track, washInstrument);

    if (!ctx || !droneBank.length) return { washVoice, specs };
    if (enabled && washEnvLevel > 0.0001 && !forceAtZero) {
      pendingRetune = true;
      return { washVoice, specs };
    }

    pendingRetune = false;
    const now = ctx.currentTime;

    if (washSilkFilter && washFormantFilter && washWarmShelf) {
      washSilkFilter.frequency.cancelScheduledValues(now);
      washSilkFilter.frequency.setValueAtTime(filterCfg.cutoffHz, now);
      washSilkFilter.Q.setValueAtTime(filterCfg.q, now);
      washFormantFilter.frequency.cancelScheduledValues(now);
      washFormantFilter.frequency.setValueAtTime(filterCfg.formantHz, now);
      washFormantFilter.gain.cancelScheduledValues(now);
      washFormantFilter.gain.setValueAtTime(filterCfg.formantGainDb, now);
      washWarmShelf.gain.cancelScheduledValues(now);
      washWarmShelf.gain.setValueAtTime(filterCfg.shelfDb, now);
    }

    for (let i = 0; i < droneBank.length && i < specs.length; i++) {
      const node = droneBank[i];
      const sp = specs[i];
      const targetHz = midiToHz(sp.midi);
      node.osc.type = sp.type;
      node.osc.frequency.cancelScheduledValues(now);
      node.osc.frequency.setValueAtTime(targetHz, now);
      node.osc.frequency.value = targetHz;
      node.vGain.gain.cancelScheduledValues(now);
      node.vGain.gain.setValueAtTime(sp.gain * 1.45, now);
      if (node.panner) {
        node.panner.pan.cancelScheduledValues(now);
        node.panner.pan.setValueAtTime(sp.pan, now);
      }
      node.midi = sp.midi;
      node.gain = sp.gain;
      node.type = sp.type;
    }
    return { washVoice, specs };
  }

  function applyWashEnvelopeGain(level, timeConstant = 0.08) {
    const clamped = Math.max(0, Math.min(1, Number(level) || 0));
    washEnvLevel = clamped <= 0.0001 ? 0 : clamped;
    if (ctx && washEnvGain) {
      if (Math.abs(washEnvLevel - lastAppliedWashTarget) > 1e-4) {
        lastAppliedWashTarget = washEnvLevel;
        const now = ctx.currentTime;
        washEnvGain.gain.setTargetAtTime(washEnvLevel, now, washEnvLevel === 0 ? 0.045 : timeConstant);
      }
    }
  }

  function refreshActiveWashesRecord(track = ENSO_TRACKS[trackIndex]) {
    if (!enabled || washPhase === 'gap' || washPhase === 'transitionGap' || washEnvLevel <= 0.0005) {
      activeWashes = [];
    } else {
      const fadeSec = Math.max(1.5, Math.min(10.0, Number(washFade) || 4.2));
      const sustainSec = Math.max(3.0, Math.min(12.0, Number(washSustain) || 7.0));
      const totalDur = droneMode === 'Continuous drone' ? fadeSec * 3.5 : (fadeSec * 2 + sustainSec);
      activeWashes = [{
        id: Math.max(1, washesTriggered),
        trackId: track.id,
        instrument: lastWashInstrument,
        mode: droneMode,
        phase: washPhase,
        envLevel: Number(washEnvLevel.toFixed(4)),
        remainingSec: washPhase === 'continuous' ? 999 : Math.max(0.1, totalDur - washPhaseElapsed),
        totalDur,
        chordMidis: lastWashChordMidis.slice(),
      }];
    }
  }

  function triggerHeavenlyWash(track = ENSO_TRACKS[trackIndex], { initial = false, crossfadeInSec = washFade } = {}) {
    if (!enabled) return false;
    const audioCtx = ensureContext();
    if (!audioCtx || !washSilkFilter) return false;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }

    const fadeSec = Math.max(1.5, Math.min(10.0, Number(crossfadeInSec || washFade) || 4.2));
    const sustainSec = Math.max(3.0, Math.min(12.0, Number(washSustain) || 7.0));
    const gapSec = Math.max(0, Math.min(8.0, Number(washGap) || 0));
    const isContinuous = (droneMode === 'Continuous drone') && (gapSec <= 0.05);

    if (!initial && washEnvLevel > 0.0005) {
      // Smooth ~10s track transition: fade out current wash at locked pitch -> silent gap -> retune at 0 -> fade in
      updateWashTargetMetadata(track, washInstrument);
      transitionActive = true;
      pendingRetune = true;
      transitionStartLevel = washEnvLevel;
      transitionOutSec = 4.5;
      transitionGapSec = 1.5;
      washPhase = 'transitionOut';
      washPhaseElapsed = 0;
      refreshActiveWashesRecord(track);
      return true;
    }

    transitionActive = false;
    applyWashEnvelopeGain(0.0, 0);
    retuneDroneBank(track, { forceAtZero: true });
    washesTriggered++;

    if (isContinuous) {
      currentWashCycleSec = fadeSec;
      washTimerSec = currentWashCycleSec;
      washPhase = 'fadeIn';
      washPhaseElapsed = 0;
      washStartFloor = 0.0;
      applyWashEnvelopeGain(0.001, 0.06);
    } else {
      const effectiveGap = gapSec > 0.05 ? gapSec : 3.0;
      currentWashCycleSec = fadeSec * 2 + sustainSec + effectiveGap;
      washTimerSec = currentWashCycleSec;
      washPhase = 'fadeIn';
      washPhaseElapsed = 0;
      washStartFloor = 0.0;
      applyWashEnvelopeGain(0.001, 0.06);
    }

    refreshActiveWashesRecord(track);
    return true;
  }

  // Smooth ~10s transition between tracks: fades out outgoing wash over 4.5s at locked pitch,
  // rests 1.5s in complete silence (retuning oscillators at 0.0 gain), and fades in new track over 4.2-4.5s.
  function crossfadeWashesToTrack(nextTrackObj, fadeSec = nextTrackObj?.washFade || 4.2) {
    applyTrackDroneDefaults(nextTrackObj);
    updateWashTargetMetadata(nextTrackObj, washInstrument);
    if (enabled) {
      triggerHeavenlyWash(nextTrackObj, { initial: false, crossfadeInSec: fadeSec });
    } else {
      applyWashEnvelopeGain(0.0, 0);
      retuneDroneBank(nextTrackObj, { forceAtZero: true });
    }
  }

  function tickWash(dt, track) {
    const fadeSec = Math.max(1.5, Math.min(10.0, Number(washFade) || 4.2));
    const sustainSec = Math.max(3.0, Math.min(12.0, Number(washSustain) || 7.0));
    const gapSec = Math.max(0, Math.min(8.0, Number(washGap) || 0));
    const isContinuous = (droneMode === 'Continuous drone') && (gapSec <= 0.05);

    // Handle long, smooth ~10s track transition phases ('transitionOut' -> 'transitionGap' -> 'fadeIn')
    if (washPhase === 'transitionOut') {
      washPhaseElapsed += dt;
      if (washPhaseElapsed >= transitionOutSec) {
        washPhase = 'transitionGap';
        washPhaseElapsed = 0;
        applyWashEnvelopeGain(0.0, 0);
        retuneDroneBank(track, { forceAtZero: true });
      } else {
        const u = Math.max(0, Math.min(1, washPhaseElapsed / transitionOutSec));
        const lvl = transitionStartLevel * 0.5 * (1.0 + Math.cos(Math.PI * u));
        applyWashEnvelopeGain(lvl, 0.06);
      }
      refreshActiveWashesRecord(track);
      return;
    }

    if (washPhase === 'transitionGap') {
      washPhaseElapsed += dt;
      applyWashEnvelopeGain(0.0, 0);
      if (pendingRetune) {
        retuneDroneBank(track, { forceAtZero: true });
      }
      if (washPhaseElapsed >= transitionGapSec) {
        transitionActive = false;
        retuneDroneBank(track, { forceAtZero: true });
        washesTriggered++;
        washPhase = 'fadeIn';
        washPhaseElapsed = 0;
        washStartFloor = 0.0;
        applyWashEnvelopeGain(0.001, 0.06);
      }
      refreshActiveWashesRecord(track);
      return;
    }

    if (isContinuous) {
      if (washPhase === 'gap' || washPhase === 'fadeOut' || washPhase === 'sustain') {
        if (washEnvLevel >= 0.98) {
          washPhase = 'continuous';
          washPhaseElapsed = 0;
          applyWashEnvelopeGain(1.0, 0.10);
        } else {
          washStartFloor = washEnvLevel;
          washPhase = 'fadeIn';
          washPhaseElapsed = 0;
        }
      }
      if (washPhase === 'fadeIn') {
        washPhaseElapsed += dt;
        if (washPhaseElapsed >= fadeSec) {
          washPhase = 'continuous';
          washPhaseElapsed = 0;
          applyWashEnvelopeGain(1.0, 0.10);
        } else {
          const u = Math.max(0, Math.min(1, washPhaseElapsed / fadeSec));
          const lvl = washStartFloor + (1.0 - washStartFloor) * 0.5 * (1.0 - Math.cos(Math.PI * u));
          applyWashEnvelopeGain(Math.max(0.001, lvl), 0.08);
        }
      } else {
        washPhase = 'continuous';
        washPhaseElapsed += dt;
        applyWashEnvelopeGain(1.0, 0.12);
      }
    } else {
      // Breathing wash mode: smooth cosine fade-in (4.0-4.5s) -> warm sustain (6.8-7.2s) -> cosine fade-out (4.0-4.5s) -> silent gap (2.5-3.2s)
      const effectiveGap = gapSec > 0.05 ? gapSec : 3.0;
      currentWashCycleSec = fadeSec * 2 + sustainSec + effectiveGap;

      if (washPhase === 'continuous') {
        washPhase = 'sustain';
        washPhaseElapsed = 0;
      }

      if (washPhase === 'fadeIn') {
        washPhaseElapsed += dt;
        if (washPhaseElapsed >= fadeSec) {
          washPhase = 'sustain';
          washPhaseElapsed = 0;
          applyWashEnvelopeGain(1.0, 0.08);
        } else {
          const u = Math.max(0, Math.min(1, washPhaseElapsed / fadeSec));
          const lvl = 0.5 * (1.0 - Math.cos(Math.PI * u));
          applyWashEnvelopeGain(Math.max(0.001, lvl), 0.08);
        }
      } else if (washPhase === 'sustain') {
        washPhaseElapsed += dt;
        applyWashEnvelopeGain(1.0, 0.10);
        if (washPhaseElapsed >= sustainSec) {
          washPhase = 'fadeOut';
          washPhaseElapsed = 0;
        }
      } else if (washPhase === 'fadeOut') {
        washPhaseElapsed += dt;
        if (washPhaseElapsed >= fadeSec) {
          washPhase = 'gap';
          washPhaseElapsed = 0;
          applyWashEnvelopeGain(0.0, 0);
          if (pendingRetune) {
            retuneDroneBank(track, { forceAtZero: true });
          }
        } else {
          const u = Math.max(0, Math.min(1, washPhaseElapsed / fadeSec));
          const lvl = 0.5 * (1.0 + Math.cos(Math.PI * u));
          applyWashEnvelopeGain(lvl, 0.08);
        }
      } else if (washPhase === 'gap') {
        washPhaseElapsed += dt;
        applyWashEnvelopeGain(0.0, 0);
        if (pendingRetune) {
          retuneDroneBank(track, { forceAtZero: true });
        }
        if (washPhaseElapsed >= effectiveGap) {
          retuneDroneBank(track, { forceAtZero: true });
          washesTriggered++;
          washPhase = 'fadeIn';
          washPhaseElapsed = 0;
          applyWashEnvelopeGain(0.001, 0.06);
        }
      }
    }

    refreshActiveWashesRecord(track);
  }

  function getWashRms() {
    if (!enabled || washEnvLevel <= 0.0005 || washLevel <= 0.0005) return 0;
    // Steady orthogonal harmonic RMS scaled by washEnvLevel and washLevel
    let sumSq = 0;
    for (let i = 0; i < droneBank.length; i++) {
      const g = droneBank[i].gain * 1.45;
      sumSq += 0.5 * g * g;
    }
    const baseRms = Math.sqrt(sumSq > 0 ? sumSq : 0.04);
    let liveRms = 0;
    if (washAnalyser && washAnalyserBuf) {
      try {
        washAnalyser.getFloatTimeDomainData(washAnalyserBuf);
        let acc = 0;
        for (let i = 0; i < washAnalyserBuf.length; i++) {
          acc += washAnalyserBuf[i] * washAnalyserBuf[i];
        }
        liveRms = Math.sqrt(acc / washAnalyserBuf.length);
      } catch {}
    }
    const synthRms = baseRms * washEnvLevel * washLevel;
    return Number((liveRms > 0.002 ? (0.35 * liveRms * washLevel + 0.65 * synthRms) : synthRms).toFixed(5));
  }

  function getPianoRms() {
    if (!enabled || !pianoAnalyser || !pianoAnalyserBuf) return 0;
    try {
      pianoAnalyser.getFloatTimeDomainData(pianoAnalyserBuf);
      let acc = 0;
      for (let i = 0; i < pianoAnalyserBuf.length; i++) {
        acc += pianoAnalyserBuf[i] * pianoAnalyserBuf[i];
      }
      return Number(Math.sqrt(acc / pianoAnalyserBuf.length).toFixed(5));
    } catch {
      return 0;
    }
  }

  function getRmsLevel() {
    return Number(Math.hypot(getPianoRms(), getWashRms()).toFixed(5));
  }

  function findClosestSample(voice, midiNote) {
    const list = sampleBank.get(voice) || (
      voice === 'piano'
        ? null
        : (sampleBank.get('pad') || sampleBank.get('choir') || sampleBank.get('drone') || sampleBank.get('tape'))
    );
    if (!list || !list.length) return null;
    let best = list[0];
    let bestDist = Math.abs(midiNote - best.midi);
    for (let i = 1; i < list.length; i++) {
      const d = Math.abs(midiNote - list[i].midi);
      if (d < bestDist) {
        bestDist = d;
        best = list[i];
      }
    }
    return best;
  }

  function scaleDegreeToMidi(track, degree, octaveOffset = 0) {
    const intervals = track.intervals;
    const len = intervals.length;
    const degIdx = ((degree % len) + len) % len;
    const octWrap = Math.floor(degree / len);
    return track.rootMidi + intervals[degIdx] + (octaveOffset + octWrap) * 12;
  }

  // Enso Markov consonance + chord-tone gravity pitch selector (from probability-engine.js & phrase-engine.js)
  function pickEnsoDegree(track) {
    const intervals = track.intervals;
    const baseWeights = track.degreeWeights;
    const gravity = track.markovGravity || [];
    const lastDeg = noteHistory.length > 0 ? noteHistory[0] : null;
    const lastInterval = lastDeg !== null && intervals[lastDeg] !== undefined ? intervals[lastDeg] : 0;

    const weights = intervals.map((iv, i) => {
      let w = Math.max(0.02, baseWeights[i] ?? 0.5);
      if (typeof gravity[i] === 'number') w *= gravity[i];
      if (currentChordDegrees && currentChordDegrees.includes(i)) w *= 1.35;
      if (lastDeg !== null) {
        const diff = Math.abs(iv - lastInterval) % 12;
        if (diff === 7) w *= 1.45;
        else if (diff === 5 || diff === 4 || diff === 3) w *= 1.32;
        else if (diff === 0 || diff === 2 || diff === 9) w *= 1.18;
        else if (diff === 1 || diff === 6) w *= 0.28;
      }
      return w;
    });

    let sum = 0;
    for (let i = 0; i < weights.length; i++) sum += weights[i];
    let r = Math.random() * sum;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) {
        noteHistory.unshift(i);
        if (noteHistory.length > 8) noteHistory.length = 8;
        return i;
      }
    }
    return 0;
  }

  function triggerVoice(voice, midiNote, velocity = 0.5, pan = 0, gainScale = 1.0) {
    if (!enabled) return false;
    const audioCtx = ensureContext();
    if (!audioCtx) return false;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }

    const match = findClosestSample(voice, midiNote);
    if (!match || !match.buffer) return false;

    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = match.buffer;
    const rate = Math.pow(2, (midiNote - match.midi) / 12);
    src.playbackRate.setValueAtTime(rate, now);

    const track = ENSO_TRACKS[trackIndex];
    const isPiano = voice === 'piano';
    const vCfg = track.voices[voice] || { gain: isPiano ? 1.0 : 0.60, attack: track.globalAttackSec || 3.2, release: 8.0 };
    const instTrim = VOICE_INSTRUMENT_TRIM[voice] ?? 0.16;
    const env = audioCtx.createGain();

    const rawDur = match.buffer.duration / rate;
    const dur = Math.max(1.2, rawDur);
    const peak = Math.max(0.005, Math.min(0.85, velocity * (vCfg.gain || 0.65) * instTrim * gainScale));

    if (isPiano) {
      // Soft 8ms wool-felt hammer onset; hold full gain across the 11.5s–12.0s reverb-stamped sample
      // so the pre-baked Enso cathedral convolution tail rings out in full with 0% live reverb CPU!
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(peak, now + 0.008);
      env.gain.setValueAtTime(peak, now + Math.max(0.5, dur - 0.30));
      env.gain.linearRampToValueAtTime(0.0001, now + dur);
      pianoNotesTriggered++;
      lastPianoMidi = midiNote;
      lastPianoSampleMidi = match.midi;
      lastPianoPlaybackRate = Number(rate.toFixed(4));
      lastPianoPeakGain = Number(peak.toFixed(4));
      pianoNoteLog.push({ midi: midiNote, sampleMidi: match.midi, playbackRate: lastPianoPlaybackRate, peakGain: lastPianoPeakGain, source: match.source });
      if (pianoNoteLog.length > 64) pianoNoteLog.shift();
    } else if (voice === 'bell') {
      // Gentle glass chime bloom
      const att = Math.min(0.08, vCfg.attack || 0.06);
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(peak, now + att);
      env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    } else {
      // Slow, breathing Enso pad/choir/tape/drone swell (2.4s–4.5s fade-in, long release)
      const att = Math.min(dur * 0.42, Math.max(1.8, (vCfg.attack || track.globalAttackSec || 3.2) * 0.78));
      const sustainEnd = Math.min(dur * 0.62, att + 0.8);
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(peak, now + att);
      env.gain.setValueAtTime(peak * 0.94, now + sustainEnd);
      env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    }

    // Per-note warm lowpass damping when a piano sample is pitch-shifted up (rate > 1)
    let voiceNode = src;
    if (isPiano && rate > 1.02) {
      const noteLp = audioCtx.createBiquadFilter();
      noteLp.type = 'lowpass';
      noteLp.frequency.setValueAtTime(Math.max(760, (track.pianoCutoffHz || 1020) / Math.pow(rate, 0.45)), now);
      noteLp.Q.value = 0.5;
      src.connect(noteLp);
      voiceNode = noteLp;
    }

    const destBus = isPiano ? (pianoFeltFilter || dryBus) : (bgWarmFilter || dryBus);

    if (audioCtx.createStereoPanner) {
      const panner = audioCtx.createStereoPanner();
      panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), now);
      voiceNode.connect(env);
      env.connect(panner);
      panner.connect(destBus);
      if (!isPiano && fdnSend) panner.connect(fdnSend);
    } else {
      voiceNode.connect(env);
      env.connect(destBus);
      if (!isPiano && fdnSend) env.connect(fdnSend);
    }

    src.start(now);
    src.stop(now + dur + 0.05);
    notesTriggered++;
    return true;
  }

  function scheduleDelayed(fn, delayMs) {
    if (delayMs <= 4) {
      fn();
      return;
    }
    const id = setTimeout(() => {
      scheduledTimers.delete(id);
      if (enabled) fn();
    }, delayMs);
    scheduledTimers.add(id);
  }

  function clearScheduledTimers() {
    for (const id of scheduledTimers) clearTimeout(id);
    scheduledTimers.clear();
    bgVoiceTimers = [];
  }

  // Enso 3-Minute Phrase-Length LFO + Aleatoric Phrase Variation Engine (from phrase-engine.js)
  function getPhraseLengthLfoCutoff(track, totalSteps) {
    const lfo = track.phraseLengthLfo;
    if (!lfo || !lfo.enabled) return totalSteps;
    const period = lfo.periodSec || 180;
    const minR = lfo.minRatio ?? 0.50;
    const maxR = lfo.maxRatio ?? 1.00;
    const phase = ((totalListenedSec % period) + period) / period;
    const wave = 0.5 * (1 + Math.cos(2 * Math.PI * phase));
    const ratio = minR + (maxR - minR) * wave;
    const minSteps = Math.min(totalSteps, Math.max(2, Math.round(totalSteps * minR)));
    return Math.max(minSteps, Math.min(totalSteps, Math.round(totalSteps * ratio)));
  }

  function triggerTrackPhrase(track, { forceFull = false } = {}) {
    const phrases = track.phrases;
    if (!phrases || !phrases.length) return;
    phraseCycleCount++;

    // Alternate between primary and variant phrase patterns like eno_soundscape/js/phrase-engine.js
    const isPrimary = phraseCycleCount <= 1 || Math.random() < 0.55;
    const pattern = isPrimary ? phrases[0] : (phrases[1] || phrases[0]);
    const totalSteps = pattern.length;

    const lfoCutoff = forceFull ? totalSteps : getPhraseLengthLfoCutoff(track, totalSteps);
    let cutoffIdx = lfoCutoff;
    const omittedSteps = new Set();

    // Enso aleatoric phrase variations (start-only dice or 1–2 omitted inner notes for spacious breathing)
    if (!forceFull && phraseCycleCount > 1 && lfoCutoff >= 3 && Math.random() < 0.55) {
      if (Math.random() < 0.42) {
        cutoffIdx = 2 + Math.floor(Math.random() * Math.max(1, lfoCutoff - 2));
      } else {
        const omitCount = lfoCutoff >= 6 ? (1 + Math.floor(Math.random() * 2)) : 1;
        for (let k = 0; k < omitCount; k++) {
          const candidate = 1 + Math.floor(Math.random() * (lfoCutoff - 1));
          if (lfoCutoff - (omittedSteps.size + 1) >= 2) omittedSteps.add(candidate);
        }
      }
    }

    const speed = Math.max(0.5, track.rotationSpeed || 1.0);

    for (let sIdx = 0; sIdx < cutoffIdx; sIdx++) {
      if (omittedSteps.has(sIdx)) continue;
      const step = pattern[sIdx];
      const delayMs = Math.round((step.delayMs || 0) / speed);

      scheduleDelayed(() => {
        const degs = step.deg;
        const octs = step.oct || [];
        const rollMs = step.rollMs || track.chordRollMs || 110;
        // Polyphonic chord headroom scaling from eno_soundscape/js/phrase-engine.js
        const chordScale = degs.length > 1 ? (1 / Math.pow(degs.length, 0.24)) : 1.0;
        const vel = (step.vel || 0.42) * chordScale;

        for (let i = 0; i < degs.length; i++) {
          let oct = octs[i] || 0;
          if (!forceFull && Math.random() < 0.03) oct += Math.random() < 0.5 ? 1 : -1;
          const midi = scaleDegreeToMidi(track, degs[i], oct);
          const pan = (Math.random() * 2 - 1) * 0.34;
          scheduleDelayed(() => {
            triggerVoice('piano', midi, vel, pan, 1.0);
          }, i * rollMs);
        }
      }, delayMs);
    }
  }

  // Enso Single-Instrument Chord Progression (triggered by track.chordInstrument on its prime cycle)
  function triggerTrackChord(track) {
    const chords = track.chords;
    if (!chords || !chords.length) return;
    const chord = chords[chordStepIdx % chords.length];
    chordStepIdx++;
    currentChordDegrees = chord.deg.slice();

    const voice = track.chordInstrument || 'pad';
    const rollMs = chord.rollMs || track.chordRollMs || 120;
    const isPianoChord = voice === 'piano';

    if (!isPianoChord) {
      if (bgVoiceTimers.length >= 2) return;
      bgVoiceTimers.push(6.5);
    }

    // Optionally omit 1 inner chord tone (phraseNoteGate = 0.22 in phrase-engine.js) so chords stay airy
    let indices = chord.deg.map((_, idx) => idx);
    if (indices.length >= 4 && Math.random() < 0.28) {
      const drop = 1 + Math.floor(Math.random() * (indices.length - 2));
      indices = indices.filter((idx) => idx !== drop);
    }

    const chordScale = 1 / Math.pow(Math.max(1, indices.length), 0.26);
    const vel = (chord.vel || track.chordVel || 0.46) * chordScale;
    const gainScale = isPianoChord ? 0.85 : 0.68;

    indices.forEach((cIdx, orderIdx) => {
      const midi = scaleDegreeToMidi(track, chord.deg[cIdx], chord.oct[cIdx] || 0);
      const pan = ((orderIdx / Math.max(1, indices.length - 1)) * 2 - 1) * 0.36;
      scheduleDelayed(() => {
        triggerVoice(voice, midi, vel, pan, gainScale);
      }, orderIdx * rollMs);
    });
  }

  function tick(dt) {
    if (!enabled || dt <= 0) return;
    const clampedDt = Math.min(dt, 0.25);
    totalListenedSec += clampedDt;
    if (bgVoiceTimers.length > 0) {
      bgVoiceTimers = bgVoiceTimers.map((t) => t - clampedDt).filter((t) => t > 0);
    }

    // 1. 3-Minute (180s) Circle-of-Fifths Automatic Track Rotation
    if (autoRotate) {
      trackElapsedSec += clampedDt;
      if (trackElapsedSec >= TRACK_ROTATE_SECONDS) {
        clearScheduledTimers();
        trackElapsedSec = 0;
        trackIndex = (trackIndex + 1) % ENSO_TRACKS.length;
        phraseCycleCount = 0;
        chordStepIdx = 0;
        const nextT = ENSO_TRACKS[trackIndex];
        syncTrackPianoFilter(nextT);
        crossfadeWashesToTrack(nextT, nextT.washFade || 4.2);
        onTrackChange?.(nextT.label, nextT);
        phraseTimerSec = transitionActive ? (transitionOutSec + transitionGapSec + 1.0) : 2.4;
      }
    }

    const track = ENSO_TRACKS[trackIndex];

    // 2. Persistent Harmonic Synth Drone / Wash Engine (100% phase-continuous WebAudio oscillators,
    //    zero .ogg sample looping or decaying background sample triggers)
    tickWash(clampedDt, track);

    // 3. Enso Felt Piano Phrase Engine (spacious 14s–24s breathing room, never overlapping)
    phraseTimerSec -= clampedDt;
    if (phraseTimerSec <= 0) {
      const baseCycle = (track.phraseCycleSec || 16.0) / Math.max(0.6, track.rotationSpeed || 1.0);
      phraseTimerSec = baseCycle * (0.90 + Math.random() * 0.30);
      if (Math.random() <= (track.phraseGateProb ?? 0.76)) {
        triggerTrackPhrase(track);
      }
    }
  }

  function setEnabled(nextEnabled) {
    const bool = !!nextEnabled;
    if (bool === enabled) return enabled;
    enabled = bool;
    if (enabled) {
      const audioCtx = ensureContext();
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.10);
        if (washMasterGain) {
          washMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
          washMasterGain.gain.setTargetAtTime(washLevel, audioCtx.currentTime, 0.12);
        }
      }
      // Reset timers & phases so the opening phrase has a full 16s+ breathing window after it plays
      const track = ENSO_TRACKS[trackIndex];
      syncTrackPianoFilter(track);
      phraseTimerSec = (track.phraseCycleSec || 16.0) * 1.05;
      voicePhases.pad = 0.45;
      voicePhases.bell = 0.10;
      voicePhases.choir = 0.30;
      voicePhases.tape = 0.15;
      voicePhases.drone = 0.55;

      // Immediately start the Persistent Harmonic Synth Drone / Wash Engine
      triggerHeavenlyWash(track, { initial: true, crossfadeInSec: washFade });

      const fireInitial = () => {
        if (!enabled) return;
        const curTrack = ENSO_TRACKS[trackIndex];
        scheduleDelayed(() => {
          if (enabled) triggerTrackPhrase(curTrack, { forceFull: true });
        }, 280);
      };
      if (sampleBank.size > 0) {
        fireInitial();
      } else {
        scheduleDelayed(fireInitial, 90);
      }
    } else {
      clearScheduledTimers();
      activeWashes = [];
      applyWashEnvelopeGain(0.0, 0.08);
      if (ctx && masterGain) {
        masterGain.gain.cancelScheduledValues(ctx.currentTime);
        masterGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
      }
    }
    onStateChange?.(enabled);
    return enabled;
  }

  function setVolume(nextVol) {
    volume = Math.max(0, Math.min(1, Number(nextVol) || 0));
    if (ctx && masterGain && enabled) {
      masterGain.gain.setTargetAtTime(volume, ctx.currentTime, 0.04);
    }
    return volume;
  }

  function setWashLevel(nextLevel) {
    const parsed = Number(nextLevel);
    washLevel = Number.isFinite(parsed) ? Math.max(0, Math.min(1, parsed)) : 0.33;
    if (ctx && washMasterGain) {
      washMasterGain.gain.setTargetAtTime(washLevel, ctx.currentTime, 0.06);
    }
    return washLevel;
  }

  function setDroneMode(nextMode) {
    if (ENSO_DRONE_MODES.includes(nextMode)) {
      droneMode = nextMode;
      const track = ENSO_TRACKS[trackIndex];
      if (droneMode === 'Continuous drone') {
        if (washPhase !== 'continuous' && washPhase !== 'fadeIn') {
          washStartFloor = Math.max(0.1, washEnvLevel);

    const meltDiff = Math.min(1.0, Math.abs(Number(fromObj.melt ?? 0) - Number(toObj.melt ?? 0)) / 0.45);
    const dt0 = typeof fromObj.doubleTerminated === 'boolean' ? (fromObj.doubleTerminated ? 1 : 0) : Number(fromObj.doubleTerminated ?? 1);
    const dt1 = typeof toObj.doubleTerminated === 'boolean' ? (toObj.doubleTerminated ? 1 : 0) : Number(toObj.doubleTerminated ?? 1);
    const dtDiff = Math.abs(dt0 - dt1);
    const countDiff = Math.min(1.0, Math.abs(Number(fromObj.crystals ?? 4) - Number(toObj.crystals ?? 4)) / 3.0);
    const shapeDiff = Math.min(
      1.0,
      Math.abs(Number(fromObj.tipAngle ?? 38) - Number(toObj.tipAngle ?? 38)) / 18.0 +
      Math.abs(Number(fromObj.thickness ?? 0.16) - Number(toObj.thickness ?? 0.16)) / 0.14 +
      Math.abs(Number(fromObj.twinShare ?? 0.3) - Number(toObj.twinShare ?? 0.3)) / 0.30
    );
    const rawDelta = Math.max(habitDiff, symDiff, hopperDiff, meltDiff, dtDiff * 0.9, countDiff * 0.85, shapeDiff * 0.85);
    return rawDelta >= 0.22 ? Math.min(1.0, (rawDelta - 0.12) / 0.55) : 0.0;
  }

  let panel = null;

  function setPresetDrift(fromName, toName, progress = 0) {
    const cleanFrom = String(fromName || store.preset || standardPresetNames[0] || 'Classic Quartz Prism');
    const cleanTo = String(toName || cleanFrom);
    const p = Number.isFinite(progress) ? Math.max(0, Math.min(1, progress)) : 0;
    store.presetDrift = {
      fromName: cleanFrom,
      toName: cleanTo,
      progress: cleanFrom === cleanTo ? 0 : p,
    };
    panel?.syncPresetTicker?.();
  }

  function prepareMorphStage(fromName, nextStageIdx, holdSeconds = 2.0) {
    morphState.fromPreset = fromName || store.preset || standardPresetNames[0] || 'Classic Quartz Prism';
    morphState.stageIndex = nextStageIdx;
    morphState.elapsed = 0;
    morphState.holdRemaining = holdSeconds;
    morphState.progress = 0;
    morphState.fromLive = false;
    cluster.morphHabitFrom = null;
    cluster.morphHabitTo = null;
    cluster.morphHabitBlend = 0;
    morphState.fromMap = Object.create(null);
    morphState.toMap = Object.create(null);
    morphState.fromOkhsl = Object.create(null);
    morphState.toOkhsl = Object.create(null);

    let targetRaw;
    if (nextStageIdx < standardPresetNames.length) {
      const targetName = standardPresetNames[nextStageIdx];
      targetRaw = presets[targetName] || {};
      morphState.toPreset = targetName;
    } else {
      morphState.diceRolls++;
      targetRaw = randomize ? randomize(store) : {};
      morphState.toPreset = 'Random Dice #' + morphState.diceRolls;
    }
    setPresetDrift(morphState.fromPreset, morphState.toPreset, 0);

    for (const p of store.params) {
      if (NON_MORPH_KEYS.has(p.key) || p.key === 'bloom' || p.noPreset || p.randomize === false) continue;
      const curVal = (fromName && presets && presets[fromName] && presets[fromName][p.key] !== undefined)
        ? presets[fromName][p.key]
        : (p.base !== undefined ? p.base : p.value);
      const toVal = targetRaw[p.key] !== undefined ? targetRaw[p.key] : p.default;
      if (p.type === 'color') {
        morphState.fromMap[p.key] = parseHexUnit(curVal);
        morphState.toMap[p.key] = parseHexUnit(toVal);
        morphState.fromOkhsl[p.key] = hexToOkhsl(String(curVal));
        morphState.toOkhsl[p.key] = hexToOkhsl(String(toVal));
      } else if (p.type === 'select' || p.type === 'bool') {
        morphState.fromMap[p.key] = curVal;
        morphState.toMap[p.key] = toVal;
      } else {
        morphState.fromMap[p.key] = Number(curVal);
        morphState.toMap[p.key] = Number(toVal);
      }
    }
    morphState.structuralDelta = computeStructuralDelta(morphState.fromMap, morphState.toMap);
  }

  function resetMorphFromPreset(presetName, holdSeconds = 2.0) {
    const idx = standardPresetNames.indexOf(presetName);
    const nextIdx = idx >= 0 ? (idx + 1) % standardPresetNames.length : 0;
    morphState.diceRolls = 0;
    prepareMorphStage(presetName, nextIdx, holdSeconds);
  }

  // Start every morph from the values actually on screen, so its first moving frame can never
  // snap (page-load defaults or saved overrides, a finished preset glide, a randomize landing).
  function captureLiveFrom() {
    for (const p of store.params) {
      if (NON_MORPH_KEYS.has(p.key) || p.key === 'bloom' || p.noPreset || p.randomize === false) continue;
      if (morphState.toMap[p.key] === undefined) continue;
      if (p.type === 'color') {
        morphState.fromMap[p.key] = parseHexUnit(p.value);
        morphState.fromOkhsl[p.key] = hexToOkhsl(String(p.value));
      } else if (p.type === 'select' || p.type === 'bool') {
        morphState.fromMap[p.key] = p.value;
      } else {
        morphState.fromMap[p.key] = Number(p.value);
      }
    }
    morphState.structuralDelta = computeStructuralDelta(morphState.fromMap, morphState.toMap);
    morphState.transitionCount = (morphState.transitionCount || 0) + 1;
    morphState.fromLive = true;
  }

  function tickMorphPresets(dt) {
    if (!P.morphPresets?.value || dt <= 0) return false;
    if (P.evolve?.value && cluster.phase === 'growing') return false;
    let rem = Math.min(dt, 600);
    let moved = false;

    while (rem > 1e-6) {
      if (morphState.holdRemaining > 0) {
        const holdTake = Math.min(rem, morphState.holdRemaining);
        morphState.holdRemaining -= holdTake;
        rem -= holdTake;
        setPresetDrift(morphState.fromPreset, morphState.toPreset, 0);
        if (rem <= 1e-6) break;
      }
      if (!morphState.fromLive) captureLiveFrom();
      const duration = Math.max(5, Math.min(600, Number(P.morphTime?.value) || 30));
      const needed = Math.max(0, duration - morphState.elapsed);
      const take = Math.min(rem, needed > 1e-6 ? needed : duration);
      morphState.elapsed += take;
      rem -= take;

      const rawT = Math.min(1, morphState.elapsed / duration);
      morphState.progress = Number(rawT.toFixed(4));
      const k = 0.5 - 0.5 * Math.cos(Math.PI * rawT);
      cluster.morphHabitFrom = morphState.fromMap.habit || P.habit?.value;
      cluster.morphHabitTo = morphState.toMap.habit || P.habit?.value;
      cluster.morphHabitBlend = k;
      setPresetDrift(morphState.fromPreset, morphState.toPreset, morphState.progress);

      for (const p of store.params) {
        if (NON_MORPH_KEYS.has(p.key) || p.key === 'bloom' || p.noPreset || p.randomize === false) continue;
        const fromV = morphState.fromMap[p.key];
        const toV = morphState.toMap[p.key];
        if (fromV === undefined || toV === undefined) continue;

        if (p.type === 'color') {
          const h0 = morphState.fromOkhsl[p.key];
          const h1 = morphState.toOkhsl[p.key];
          if (h0 && h1 && Number.isFinite(h0.h) && Number.isFinite(h1.h) && h0.s > 0.12 && h1.s > 0.12) {
            const dh = ((h1.h - h0.h + 1.5) % 1) - 0.5;
            const h = (h0.h + dh * k + 1) % 1;
            const s = h0.s + (h1.s - h0.s) * k;
            const l = h0.l + (h1.l - h0.l) * k;
            const hex = okhslToHex(h, s, l);
            store.setSmooth(p, hex);
            p.base = p.value;
          } else {
            const r = fromV[0] + (toV[0] - fromV[0]) * k;
            const g = fromV[1] + (toV[1] - fromV[1]) * k;
            const b = fromV[2] + (toV[2] - fromV[2]) * k;
            store.setSmooth(p, null, [r, g, b]);
            p.base = p.value;
          }
        } else if (p.key === 'hueShift') {
          const dh = ((toV - fromV + 540) % 360) - 180;
          const hVal = ((fromV + dh * k) % 360 + 360) % 360;
          store.setSmooth(p, hVal);
          p.base = p.value;
        } else if (p.key === 'doubleTerminated') {
          const f0 = typeof fromV === 'boolean' ? (fromV ? 1.0 : 0.0) : Number(fromV);
          const f1 = typeof toV === 'boolean' ? (toV ? 1.0 : 0.0) : Number(toV);
          const dtVal = f0 + (f1 - f0) * k;
          cluster.doubleTermBlend = dtVal;
          const nextBool = dtVal >= 0.5;
          if (p.value !== nextBool) {
            store.setSmooth(p, nextBool);
            p.base = p.value;
          }
        } else if (p.type === 'select' || p.type === 'bool') {
          const nextChoice = k >= 0.5 ? toV : fromV;
          if (p.value !== nextChoice) {
            store.setSmooth(p, nextChoice);
            p.base = p.value;
          }
        } else {
          const v = fromV + (toV - fromV) * k;
          store.setSmooth(p, v);
          p.base = p.value;
        }
      }
      moved = true;

      if (morphState.elapsed >= duration - 1e-5) {
        store.setPresetName(morphState.toPreset);
        prepareMorphStage(morphState.toPreset, (morphState.stageIndex + 1) % standardPresetNames.length, 2.0);
      }
    }
    return moved;
  }

  // Initialize initial seed-to-full-size evolution & preset morph pipeline
  resetEvolution(P, { startFromSeed: !capture && !sp.has('growth') && !!P.evolve?.value });
  resetMorphFromPreset(store.preset || standardPresetNames[0] || 'Classic Quartz Prism', 2.0);

  let occlusionDriftTime = 0;
  let occlusionManualHold = 0;
  let smoothOcclusion = Number(P.occlusion?.value) || 0;
  let targetOcclusion = smoothOcclusion;

  function doRandomize(seconds = 18.0) {
    if (!randomize) return;
    const dur = typeof seconds === 'number' && Number.isFinite(seconds) ? seconds : 18.0;
    saveOnLanding = true;
    const fromSnap = {};
    for (const p of store.params) fromSnap[p.key] = p.value;
    const prevName = store.preset || morphState.fromPreset || standardPresetNames[0] || 'Classic Quartz Prism';
    store.setPresetName(prevName);
    const targetValues = store.randomize(randomize, dur);
    prepareMorphStage('Randomized', standardPresetNames.length, 2.5);
    setPresetDrift('Randomized', morphState.toPreset, 0);
    syncPageColour();
    panel.syncAll();
    panel.refreshStatus();
    store.scheduleSave();
    return { fromSnap, targetValues, duration: dur };
  }

  function growMore() {
    if (!P.growth) return;
    growBoost = Math.min(1.6, growBoost + 0.32);
    growBoostTotal = growBoost;
    growBoostElapsed = 0;
    const curG = Number(P.growth.value);
    const targetG = curG + growBoost;
    if (targetG > P.growth.max - 0.1) {
      store.setRange(P.growth, P.growth.min, Number(Math.min(4.5, targetG + 0.5).toFixed(2)));
    }
    if (P.evolve?.value) {
      cluster.surgeBranch?.(P);
    }
    syncHudButtons();
    panel.syncAll();
    panel.refreshStatus();
    store.scheduleSave();
  }

  const soundBtn = document.getElementById('sound-btn');
  const soundIconOn = document.getElementById('sound-icon-on');
  const soundIconOff = document.getElementById('sound-icon-off');
  const unmuteCenterBtn = document.getElementById('unmute-center-btn');

  function syncParamsFromTrack(track, { syncPanel = true } = {}) {
    if (!track) return;
    if (P.soundTrack && P.soundTrack.value !== track.label) {
      store.setValue(P.soundTrack, track.label);
      P.soundTrack.base = track.label;
    }
    if (P.droneMode && track.droneMode) {
      store.setValue(P.droneMode, track.droneMode);
      P.droneMode.base = track.droneMode;
    }
    if (P.washInstrument && track.washInstrument) {
      store.setValue(P.washInstrument, track.washInstrument);
      P.washInstrument.base = track.washInstrument;
    }
    if (P.washFade && Number.isFinite(track.washFade)) {
      store.setValue(P.washFade, track.washFade);
      P.washFade.base = track.washFade;
    }
    if (P.washGap && Number.isFinite(track.washGap)) {
      store.setValue(P.washGap, track.washGap);
      P.washGap.base = track.washGap;
    }
    if (syncPanel && panel) {
      panel.syncAll();
      panel.refreshStatus();
      store.scheduleSave();
    }
  }

  const sound = createEnsoSound({
    onTrackChange(nextLabel, nextTrack) {
      syncParamsFromTrack(nextTrack || sound.currentTrack, { syncPanel: true });
    },
    onStateChange() {
      syncHudButtons();
    },
  });

  // Sync initial Enso track and drone/wash defaults on page load
  if (P.soundTrack && !sp.has('soundTrack')) {
    const startTrack = sound.currentTrack;
    syncParamsFromTrack(startTrack, { syncPanel: false });
    P.soundTrack.default = startTrack.label;
  }

  function syncSoundFromParams(changedKey) {
    if (P.soundVolume) sound.setVolume(P.soundVolume.value);
    if (P.washLevel) sound.setWashLevel(P.washLevel.value);
    if (P.soundRotate) sound.setAutoRotate(P.soundRotate.value);
    if (P.soundReverbMode) sound.setReverbMode(P.soundReverbMode.value);
    if ((changedKey === 'soundTrack' || changedKey === 'trackName') && P.soundTrack) {
      sound.setTrack(P.soundTrack.value);
    } else if (!changedKey || changedKey === 'reset') {
      if (P.soundTrack && P.soundTrack.value !== sound.currentTrack.label) {
        sound.setTrack(P.soundTrack.value);
      }
      if (P.droneMode) sound.setDroneMode(P.droneMode.value);
      if (P.washInstrument) sound.setWashInstrument(P.washInstrument.value);
      if (P.washFade) sound.setWashFade(P.washFade.value);
      if (P.washGap) sound.setWashGap(P.washGap.value);
    } else if (changedKey === 'droneMode' && P.droneMode) {
      if (P.droneMode.value === 'Breathing wash' && P.washGap && Number(P.washGap.value) <= 0) {
        const defGap = Number.isFinite(sound.currentTrack?.washGap) && sound.currentTrack.washGap > 0 ? sound.currentTrack.washGap : 3.0;
        store.setValue(P.washGap, defGap);
      } else if (P.droneMode.value === 'Continuous drone' && P.washGap && Number(P.washGap.value) > 0) {
        store.setValue(P.washGap, 0);
      }
      sound.setDroneMode(P.droneMode.value);
      if (P.washGap) sound.setWashGap(P.washGap.value);
      panel?.syncAll();
    } else if (changedKey === 'washInstrument' && P.washInstrument) {
      sound.setWashInstrument(P.washInstrument.value);
    } else if (changedKey === 'washFade' && P.washFade) {
      sound.setWashFade(P.washFade.value);
    } else if (changedKey === 'washGap' && P.washGap) {
      sound.setWashGap(P.washGap.value);
    }
    if (P.sound) {
      sound.setEnabled(!!P.sound.value);
    }
    syncHudButtons();
  }

  function toggleSound() {
    if (!P.sound) return;
    const next = !P.sound.value;
    store.setValue(P.sound, next);
    P.sound.base = next;
    syncSoundFromParams('sound');
    panel.syncAll();
    panel.refreshStatus();
    store.scheduleSave();
  }

  const chrome = setupChrome(!capture, () => {}, {
    onRandomize: doRandomize,
    onGrow: growMore,
    onSound: toggleSound,
  });

  function applyPreset(name, seconds, save = true) {
    const all = { ...(presets || {}), ...(store.customPresets || {}) };
    if ((name === 'Gallium' || name === 'Gallium Melt' || name === 'Melting Gallium' || name === 'Gallium Crystal') && all['Liquid Gallium']) {
      name = 'Liquid Gallium';
    }
    if (!all[name] && !(name === 'Glacial Ice' && all['Blue Celestite'])) return 0;
    const s = seconds !== undefined ? seconds : (instance?.presetSeconds?.(all[name]) ?? presetSeconds);
    saveOnLanding = save;
    const own = !!instance?.morph;
    if (!store.preset) {
      store.setPresetName(morphState.fromPreset || standardPresetNames[0] || 'Classic Quartz Prism');
    }
    store.applyPreset(name, s, !own && s > 0, Math.min(s, 1.25));
    if (s > 0) morphState.transitionCount = (morphState.transitionCount || 0) + 1;
    if (own && s > 0) instance.morph(s, store.preset);
    resetMorphFromPreset(store.preset, 2.0);
    setPresetDrift(store.preset || name, morphState.toPreset, 0);
    if (s <= 0) {
      cluster.snapToTarget?.(P);
    } else {
      cluster.morphHabitFrom = store.glideHabitFrom;
      cluster.morphHabitTo = store.glideHabitTo;
      cluster.morphHabitBlend = 0;
    }
    syncPageColour();
    syncHudButtons();
    panel.syncAll();
    panel.refreshStatus();
    if (save) store.scheduleSave();
    return s;
  }

  panel = buildPanel({
    slug,
    store,
    presets,
    onPreset: (name, seconds) => applyPreset(name, seconds),
    onRandomize: doRandomize,
    onSkipTrack: () => sound.nextTrack(1),
    onEdited(changedKey) {
      if (changedKey === 'defaultZoom') {
        syncDefaultZoomToCamera(true);
        panel.syncAll();
      } else if (changedKey === 'reset') {
        resetEvolution(P, { startFromSeed: !!P.evolve?.value });
        resetMorphFromPreset(store.preset || standardPresetNames[0]);
        syncSoundFromParams('reset');
      } else if (changedKey && SOUND_PARAM_KEYS.has(changedKey)) {
        syncSoundFromParams(changedKey);
      } else if (changedKey === 'occlusionStyle' && P.occlusion) {
        occlusionManualHold = 0;
        const st = String(P.occlusionStyle?.value || 'Auto drift (1/3 time)');
        if (st === 'Always on (Massive)') targetOcclusion = 0.92;
        else if (st === 'Subtle') targetOcclusion = 0.38;
        else if (st === 'Off') targetOcclusion = 0.0;
        panel.syncAll();
      } else if (changedKey === 'occlusion' || changedKey === 'occlusionType') {
        occlusionManualHold = 180.0;
        smoothOcclusion = Number(P.occlusion?.value) || 0;
        targetOcclusion = smoothOcclusion;
      } else if (changedKey) {
        cluster.applyManualParam?.(changedKey, P);
        if (P[changedKey] && morphState.fromMap[changedKey] !== undefined) {
          if (P[changedKey].type === 'color') {
            const rgb = parseHexUnit(P[changedKey].value);
            morphState.fromMap[changedKey] = rgb;
            morphState.toMap[changedKey] = rgb;
            morphState.fromOkhsl[changedKey] = hexToOkhsl(String(P[changedKey].value));
            morphState.toOkhsl[changedKey] = hexToOkhsl(String(P[changedKey].value));
          } else if (P[changedKey].type === 'select' || P[changedKey].type === 'bool') {
            morphState.fromMap[changedKey] = P[changedKey].value;
            morphState.toMap[changedKey] = P[changedKey].value;
          } else {
            morphState.fromMap[changedKey] = Number(P[changedKey].value);
            morphState.toMap[changedKey] = Number(P[changedKey].value);
          }
        }
      }
      store.scheduleSave();
      syncPageColour();
      syncHudButtons();
      panel.refreshStatus();
    },
  });

  // ---- Top HUD buttons: Preset pill, Sound, Grow, Randomize
  const hudPresetWrap = document.getElementById('hud-preset');
  const growBtn = document.getElementById('grow-btn');
  const randHudBtn = document.getElementById('rand-btn');
  const prevPresetBtn = document.getElementById('prev-preset');
  const nextPresetBtn = document.getElementById('next-preset');
  const hudPresetNameBtn = document.getElementById('hud-preset-name');
  const hudMobileSelect = document.getElementById('hud-preset-mobile-select');
  const hudPresetDropdown = document.getElementById('hud-preset-dropdown');
  let lastHudMenuKey = '';

  const HABIT_STUDY_NAMES = new Set([
    'Tabular Aquamarine',
  ]);

  function syncHudPresetDropdown() {
    const allPresetNames = Object.keys(presets || {});
    const curatedNames = allPresetNames.filter((n) => !HABIT_STUDY_NAMES.has(n));
    const habitStudyNames = allPresetNames.filter((n) => HABIT_STUDY_NAMES.has(n));
    const customNames = Object.keys(store.customPresets || {});
    const activeName = store.preset || morphState.fromPreset || allPresetNames[0] || 'Classic Quartz Prism';
    const menuKey = `${activeName}|${allPresetNames.join(',')}|${customNames.join(',')}`;
    if (menuKey === lastHudMenuKey) return;
    lastHudMenuKey = menuKey;

    if (hudMobileSelect) {
      hudMobileSelect.innerHTML = '';
      const appendOptGroup = (label, names) => {
        if (!names.length) return;
        const grp = document.createElement('optgroup');
        grp.label = label;
        for (const n of names) {
          const opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          if (n === activeName) opt.selected = true;
          grp.appendChild(opt);
        }
        hudMobileSelect.appendChild(grp);
      };
      appendOptGroup('Curated Gems', curatedNames);
      appendOptGroup('Habit Studies', habitStudyNames);
      appendOptGroup('Saved Presets', customNames);
    }

    if (hudPresetDropdown) {
      hudPresetDropdown.innerHTML = '';
      const addGroup = (label, names, sourceObj) => {
        if (!names.length) return;
        const hdr = document.createElement('div');
        hdr.className = 'hud-preset-group-label';
        hdr.textContent = label;
        hudPresetDropdown.appendChild(hdr);
        for (const n of names) {
          const def = sourceObj[n] || {};
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.role = 'option';
          btn.className = 'hud-preset-item' + (n === activeName ? ' is-active' : '');
          btn.setAttribute('aria-selected', String(n === activeName));
          btn.dataset.preset = n;

          const dot = document.createElement('span');
          dot.className = 'hud-preset-dot';
          const col = String(def.stoneColour || '#b4c4dc');
          dot.style.background = col;
          dot.style.color = col;

          const nameSpan = document.createElement('span');
          nameSpan.className = 'hud-preset-item-name';
          nameSpan.textContent = n;

          const metaSpan = document.createElement('span');
          metaSpan.className = 'hud-preset-item-meta';
          const rawHabit = String(def.habit || 'Trigonal').split('/')[0].trim();
          metaSpan.textContent = rawHabit;

          const checkSpan = document.createElement('span');
          checkSpan.className = 'hud-preset-item-check';
          checkSpan.setAttribute('aria-hidden', 'true');
          checkSpan.textContent = '✓';

          btn.append(dot, nameSpan, metaSpan, checkSpan);
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeHudPresetDropdown();
            applyPreset(n);
          });
          hudPresetDropdown.appendChild(btn);
        }
      };
      addGroup('Curated Gems', curatedNames, presets || {});
      addGroup('Habit Studies', habitStudyNames, presets || {});
      addGroup('Saved Presets', customNames, store.customPresets || {});
    }
  }

  function closeHudPresetDropdown() {
    if (!hudPresetDropdown) return;
    hudPresetDropdown.hidden = true;
    hudPresetWrap?.classList.remove('dropdown-open');
    hudPresetNameBtn?.setAttribute('aria-expanded', 'false');
  }

  function toggleHudPresetDropdown() {
    if (!hudPresetDropdown) return;
    const willOpen = hudPresetDropdown.hidden;
    if (willOpen) {
      lastHudMenuKey = '';
      syncHudPresetDropdown();
      hudPresetDropdown.hidden = false;
      hudPresetWrap?.classList.add('dropdown-open');
      hudPresetNameBtn?.setAttribute('aria-expanded', 'true');
    } else {
      closeHudPresetDropdown();
    }

  float LRow = max(body(row, 1).w, 0.08);
  float rRow = max(body(row, 2).w, 0.02);
  vec3 rtRow = body(row, 3).xyz;
  vec3 p0 = body(row, PA).xyz;
  vec3 side1 = p0 - axRow * dot(p0, axRow);
  float sLen = length(side1);
  side1 = sLen > 1e-4 ? (side1 / sLen) : normalize(cross(axRow, vec3(0.577, 0.577, 0.577)));
  vec3 side2 = cross(axRow, side1);

  int tRow = occPartnerRow(row, m);
  vec3 axTpl = body(tRow, 1).xyz;
  float LTpl = max(body(tRow, 1).w, 0.08);
  float rTpl = max(body(tRow, 2).w, 0.02);
  vec3 rtTpl = body(tRow, 3).xyz;
  vec3 cTpl = rtTpl + axTpl * (LTpl * 0.48);

  float uid = max(1.0, body(row, 2).z);
  float azV = uid * 2.399963 + float(m) * 2.45 + 0.55;
  vec3 outDir = side1 * cos(azV) + side2 * sin(azV);
  vec3 tanDir = -side1 * sin(azV) + side2 * cos(azV);
  float hFrac = (m == 0) ? 0.40 : 0.70;
  vec3 cAnchor = rtRow + axRow * (LRow * hFrac) + outDir * (rRow * 0.94);
  vec3 rotAxis = normalize(tanDir + axRow * ((m == 0) ? 0.28 : -0.24));
  float ang = (m == 0) ? 1.12 : -1.02;
  float cosA = cos(ang), sinA = sin(ang);
  float invScale = clamp((rTpl / max(rRow, 0.02)) * 0.76, 0.48, 1.28) / max(g, 0.02);

  vec3 roTpl = cTpl + rotateAroundAxis((ro - cAnchor) * invScale, rotAxis, cosA, sinA);
  vec3 rdTpl = rotateAroundAxis(rd * invScale, rotAxis, cosA, sinA);

  vec3 enterPlN = vec3(0.0, 1.0, 0.0);
  vec3 exitPlN = vec3(0.0, 1.0, 0.0);
  int kExit = 0;
  for (int k = 0; k < 18; k++) {
    vec4 pl = body(tRow, PA + k);
    float dn = dot(pl.xyz, rdTpl);
    float dist = pl.w - dot(pl.xyz, roTpl);
    if (abs(dn) < 1e-8) {
      if (dist < 0.0) return false;
      continue;
    }
    float tPl = dist / dn;
    if (dn < 0.0) {
      if (tPl > tc0) { tc0 = tPl; enterPlN = pl.xyz; }
    } else if (tPl < tc1) {
      tc1 = tPl; exitPlN = pl.xyz; kExit = k;
    }
    if (tc0 > tc1) return false;
  }
  if (tc1 <= tc0) return false;

  enterN = normalize(rotateAroundAxis(enterPlN, rotAxis, cosA, -sinA) + 1e-6);
  exitN = normalize(rotateAroundAxis(exitPlN, rotAxis, cosA, -sinA) + 1e-6);

  if (needSeam) {
    vec3 pTplExit = roTpl + rdTpl * tc1;
    float dMinSeam = 1e9;
    for (int k = 0; k < 18; k++) {
      if (k == kExit) continue;
      vec4 pl = body(tRow, PA + k);
      float rawD = max(0.0, pl.w - dot(pl.xyz, pTplExit));
      if (rawD >= dMinSeam * invScale) continue;
      float cosAng = dot(pl.xyz, exitPlN);
      if (cosAng > 0.995) continue;
      float sinAng = sqrt(max(1e-3, 1.0 - cosAng * cosAng));
      float dPl = rawD / (sinAng * invScale);
      if (dPl < dMinSeam) dMinSeam = dPl;
    }
    exitSeam = dMinSeam;
  }
  return true;
}

bool evalSingleVoidInterval(int row, int m, vec3 ro, vec3 rd, bool needSeam, out float tc0, out float tc1, out vec3 enterN, out vec3 exitN, out float exitSeam) {
  float kType = clamp(u_occlusionType, 0.0, 1.0);
  bool useCrystal = (kType >= 0.85) || (kType > 0.15 && m == 0);
  if (useCrystal) {
    return evalCrystalVoidInterval(row, m, ro, rd, needSeam, tc0, tc1, enterN, exitN, exitSeam);
  }
  return evalOvoidVoidInterval(row, m, ro, rd, tc0, tc1, enterN, exitN, exitSeam);
}

// Unified 3D CSG Occlusion Void Carve:
// Subtracts 3D ovoid/crystal void volumes [tc0, tc1] from crystal interval [tn, tf], advancing tn to tc1
// when a cavity is carved into the front face (with true 3D interior wall normal outVoidN and crisp 3D
// border distance outVoidBorder) or returning false when the void slices completely through the silhouette.
bool applyOcclusionVoidCSG(int row, vec3 ro, vec3 rd, inout float tn, inout float tf, inout int kn, out vec3 outVoidN, out float outVoidBorder, out float outVoidSeam) {
  outVoidN = (kn < CP) ? body(row, PA + kn).xyz : vec3(0.0, 1.0, 0.0);
  outVoidBorder = 1e9;
  outVoidSeam = 1e9;
  if (u_occlusion <= 0.002) return true;
  float rRow = max(body(row, 2).w, 0.02);
  float tnOrig = max(tn, 0.0);
  float tfOrig = tf;

  for (int m = 0; m < 2; m++) {
    float tc0, tc1, exitSeam;
    vec3 enterN, exitN;
    if (!evalSingleVoidInterval(row, m, ro, rd, true, tc0, tc1, enterN, exitN, exitSeam)) continue;

    float tStart = max(tn, 0.0);
    if (tc0 <= tStart + rRow * 0.06 && tc1 > tStart) {
      if (tc1 >= tf - 1e-4) return false;
      float dFront = max(0.0, tc1 - tnOrig);
      float dBack = max(0.0, tf - tc1);
      float dLip = (tc0 > tnOrig - rRow * 0.08) ? max(0.0, tnOrig + rRow * 0.06 - tc0) : 1e9;
      tn = tc1;
      kn = CP + m + 1;
      outVoidN = -exitN;
      outVoidBorder = min(dFront, min(dBack, dLip));
      outVoidSeam = exitSeam;
    } else if (tc0 > tStart && tc0 < tf && tc1 >= tf - rRow * 0.06) {
      float dBackCut = max(0.0, tfOrig - tc0);
      float dThru = max(0.0, tc0 - tStart);
      tf = tc0;
      if (tf <= max(tn, 0.0) + 1e-4) return false;
      outVoidBorder = min(outVoidBorder, min(dBackCut, dThru));
      outVoidSeam = min(outVoidSeam, exitSeam);
    }
  }
  return tf > max(tn, 0.0) + 1e-4;
}

float n3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x),
        mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
    mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
        mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y),
    f.z);
}

float n1d(float x, float s) {
  float i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(hash(vec3(i, s, f_seed)), hash(vec3(i + 1.0, s, f_seed)), f);
}

float fbm1(float x, float s) {
  return 0.56 * n1d(x, s)
       + 0.29 * n1d(x * 2.17 + 1.9, s + 5.3)
       + 0.15 * n1d(x * 4.53 + 3.7, s + 11.7);
}

float steppedNoise(float x, float s) {
  float i = floor(x), f = fract(x);
  float h0 = hash(vec3(i, s + 17.0, f_seed));
  float h1 = hash(vec3(i + 1.0, s + 17.0, f_seed));
  float stepF = smoothstep(0.32, 0.68, f);
  float terrace = mix(h0, h1, stepF);
  float shelf = floor(terrace * 4.5 + 0.5) / 4.5;
  return mix(terrace, shelf, 0.65);
}

float cellularChip(float x, float s) {
  float i = floor(x), f = fract(x) - 0.5;
  float h = hash(vec3(i, s + 31.0, f_seed));
  float chipAct = step(0.28, h);
  float halfW = mix(0.18, 0.44, fract(h * 13.7));
  float u = clamp(abs(f) / halfW, 0.0, 1.0);
  return chipAct * (1.0 - u * u) * mix(0.45, 1.0, fract(h * 7.9));
}

float sn1(float x, float s) {
  return clamp((n1d(x, s) - 0.5) * 2.85, -1.0, 1.0);
}

// Two-Stage SDF Evaluation (Optimization 1):
// Stage 1 (crystalSDF_fast): coarse analytic 18-plane polyhedron SDF (zero 3D noise calls when far from surface, abs(d) >= 0.045).
// Stage 2 (crystalSDF_full / crystalSDF): detailed 3D CSG edge-chip, irregularity, and basal-cavity evaluation
// evaluated ONLY when near surface (abs(d) < 0.045) and inside calcNormal().
float crystalSDF_fast(vec3 p, int row, out float secondD, out float thirdD, out float ridgeBevel) {
  float d = -1e9;
  secondD = -1e9;
  thirdD = -1e9;
  for (int k = 0; k < 18; k++) {
    vec4 pl = body(row, PA + k);
    float dp = dot(pl.xyz, p) - pl.w;
    if (dp > d) {
      thirdD = secondD;
      secondD = d;
      d = dp;
    } else if (dp > secondD) {
      thirdD = secondD;
      secondD = dp;
    } else if (dp > thirdD) {
      thirdD = dp;
    }
  }
  ridgeBevel = (d + secondD) * 0.70710678;
  return d;
}

// 3D Architectural Bismuth Hopper & Ziggurat Morphological Carver (post-015895, post-015966):
// Pure branchless register-only O(1) evaluation in crystal-local q in [-1, 1]^3 coordinates.
// Precomputes per-crystal morphP once outside the march loop to model 5 distinct Bismuth morphologies:
//   0: Broad Open-Sided Cantilevered Hopper Wing (BGS specimen: 3-step bottom-left cutout, 6 nested steps)
//   1: 5-Tier Aztec Ziggurat Pyramid & Stepped Pagoda Spire (Encyclopedia & Wikipedia stepped pyramid/tower)
//   2: Open-Sided L-Bracket / U-Channel Greek-Key Tower (RSC Education opposite L-notches + open U-channel)
//   3: Diagonal Stair-Stepped Parallel-Ribbed Terrace ("Rainbow Metal" 8 parallel metallic comb ribs)
//   4: Asymmetric Cantilevered Stepped Fin Bar / Twin Hopper Bracket
vec4 getBismuthMorphParams(int uidInt) {
  int seedShift = int(mod(floor(abs(f_seed)), 5.0));
  int m = (uidInt <= 3) ? (uidInt - 1) : ((uidInt - 1 + seedShift) % 5);
  return (m == 0) ? vec4(0.36, -0.44, -6.0,  1.0)
       : (m == 1) ? vec4(0.46,  0.35,  5.0,  0.6)
       : (m == 2) ? vec4(0.44, -0.34,  4.0,  1.2)
       : (m == 3) ? vec4(0.45, -0.45, -7.0, -1.0)
                  : vec4(0.46,  0.24, -4.0,  0.8);
}

float quantStairFast(float t, float nSteps) {
  float s = clamp(t, 0.0, 0.9999) * nSteps;
  float idx = floor(s);
  return (idx + smoothstep(0.74, 0.95, s - idx)) / nSteps;
}

float evalBismuthFast(vec3 pQ, vec4 morphP, float hopperAmt, out float outStepIdx, out float outEdgeDist) {
  float nSt = abs(morphP.z);
  // 1. Broken-out 3D 90-degree stair-stepped silhouette across ALL 3 AXES (X, Y, Z)
  float yUp = clamp((pQ.y + 0.90) * 0.54, 0.0, 1.0);
  float yDn = clamp((0.90 - pQ.y) * 0.54, 0.0, 1.0);
  float xPos = clamp((pQ.x + 0.85) * 0.56, 0.0, 1.0);
  float zPos = clamp((pQ.z + 0.85) * 0.56, 0.0, 1.0);
  float stairA = quantStairFast(morphP.z > 0.0 ? yUp : yDn, 5.0);
  float stairB = quantStairFast(morphP.y >= 0.0 ? yUp : yDn, 4.0);
  float stairC = quantStairFast(xPos, 4.0);
  float stairZ = quantStairFast(zPos, 4.0);

  float maxPosX =  1.002 - morphP.x * stairA * hopperAmt;
  float minNegX = -1.002 + abs(morphP.y) * stairB * hopperAmt;
  float minNegY = -1.002 + 0.36 * stairC * hopperAmt;
  float maxPosY =  1.002 - 0.32 * stairZ * hopperAmt;
  float maxPosZ =  1.002 - 0.38 * stairA * hopperAmt;
  float minNegZ = -1.002 + 0.34 * stairB * hopperAmt;

  float wX = min(maxPosX - pQ.x, pQ.x - minNegX);
  float wY = min(maxPosY - pQ.y, pQ.y - minNegY);
  float wZ = min(maxPosZ - pQ.z, pQ.z - minNegZ);

  float wFace = min(wX, min(wY, wZ));
  float dContour = max(min(wX, wY), min(max(wX, wY), wZ));
  float polyAllow = 0.65 * max(0.0, 1.0 - hopperAmt / 0.88);

  // Active 2D face coordinates for internal G-spiral / L-bracket / parallel-rib walls
  vec2 uv = (wZ <= wX && wZ <= wY) ? pQ.xy
          : (wX <= wY)             ? vec2(pQ.z, pQ.y)
                                   : vec2(pQ.x, pQ.z);

  // Open-sided L-bracket / G-spiral breach that breaks through both the outer rim and inner terraces (post-016625)
  float openGap = smoothstep(0.05, 0.14, uv.x * sign(morphP.w)) * (1.0 - smoothstep(0.18, 0.30, abs(uv.y - 0.12 * sign(morphP.z))));
  float effRim = 0.115 - 0.088 * openGap;

  float insideWell = smoothstep(effRim, effRim + 0.030, dContour) * (1.0 - smoothstep(0.66, 0.86, abs(pQ.y) * (1.0 - 0.30 * openGap)));
  float wellEase = smoothstep(0.02, 0.38, hopperAmt);
  if (insideWell <= 1e-4) {
    outStepIdx = (0.9 * stairA + 0.6 * stairB + 0.5 * stairZ) * hopperAmt * wellEase;
    outEdgeDist = mix(1.0, abs(dContour - effRim), wellEase);
    return wFace + polyAllow;
  }

  // 2. Contour-following stepped hopper tiers + broken G-spiral / sub-chamber divider bars
  float normContour = clamp((dContour - effRim) / 0.68, 0.0, 1.0);
  float wellStair = quantStairFast(normContour, nSt);
  float sWell = normContour * nSt;
  float fWell = fract(sWell);

  float ridgePhase = abs(fWell - 0.36);
  float concentricRidge = (1.0 - smoothstep(0.13, 0.21, ridgePhase)) * (1.0 - 0.92 * openGap);

  // Parallel comb ribs (active when morphP.w < 0)
  float parCoord = (uv.x - uv.y * 0.16) * 4.0;
  float parWave = abs(fract(parCoord) - 0.5);
  float parallelRibs = 1.0 - smoothstep(0.14, 0.22, parWave);

  // Asymmetric Greek-key inner G-hook bar + sub-chamber partition bar
  float dHook1 = max(abs(uv.x - 0.05 * sign(morphP.w)) - 0.30, abs(uv.y - 0.10) - 0.052);
  float dHook2 = max(abs(uv.x + 0.14 * sign(morphP.w)) - 0.052, abs(uv.y + 0.03) - 0.28);
  float greekHook = 1.0 - smoothstep(-0.012, 0.012, min(dHook1, dHook2));

  float wallMask = (morphP.w < 0.0)
    ? max(parallelRibs * 0.88, max(concentricRidge * 0.72, greekHook * 0.65))
    : max(concentricRidge, greekHook);

  float floorDepth = (0.22 + 0.50 * wellStair) * hopperAmt * wellEase;
  float ridgeTopDepth = (0.05 + 0.13 * wellStair) * hopperAmt * wellEase;
  float targetDepth = mix(floorDepth, ridgeTopDepth, wallMask) * insideWell;

  outStepIdx = ((0.65 + 2.8 * wellStair + 1.2 * stairA - 0.55 * wallMask) * insideWell + abs(morphP.w) * 0.25) * hopperAmt * wellEase;
  float eWell = min(fWell, 1.0 - fWell) / nSt;
  float rawEdgeDist = min(min(eWell, abs(dContour - effRim)), (morphP.w < 0.0) ? abs(parWave - 0.18) * 0.25 : abs(ridgePhase - 0.16) / nSt);
  outEdgeDist = mix(1.0, rawEdgeDist, wellEase);
  return (wFace + polyAllow * (1.0 - insideWell)) - targetDepth;
}

float evalBismuthHopper(vec3 p, int row, float hopperAmt, out float outStepIdx, out float outEdgeDist) {
  outStepIdx = 0.0;
